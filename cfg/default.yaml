expr_name: test
log_dir: ./logs
seed: 0
device_num: 1

Environment:
  Entities:
    - entity_name: 'government'
      entity_args:
        n: 2
        action_shape: 6

    - entity_name: 'household'
      entity_args:
        n: 100
        CRRA: 1
        IFE: 1
        action_shape: 2
        rho_e: 0.982
        sigma_e: 0.200

  env_core:
    possible_agents: ['government', 'households']
    env_args:
      alpha: 1/3
      year_per_step: 1
      termination_check_after_steps: 20
      wealth_gini_termination_threshold: 0.85
      income_gini_termination_threshold: 0.469
      depreciation_rate: 0.06
      consumption_tax_rate: 0.065
      household_asset_interest_rate_max: 0.05
      gov_action_interval: 10
      fiscal:
        capital_tax_max: 0.05
        income_tax_max: 0.5
        asset_tax_max: 0.02
        progressivity_max: 2.0
        income_reference: 30000.0
        asset_reference: 100000.0
        transfer_gdp_max: 0.25
        bond_interest_rate: 0.04
        capital_mobility: 1.0
        capital_mobility_curriculum_epochs: 1000
        initial_debt_to_gdp: 0.6
      household_reward:
        hours_reference: 2000.0
        consumption_floor: 1e-6

      capital_failure_penalty:
        government: 100.0
        household: 100.0

      government_reward:
        output_floor: 1e-8


Trainer:
  max_kl: 0.01
  cg_iters: 10
  cg_residual_tol: 1e-10
  cg_damping: 0.1
  damping: 0.01
  ppo_epoch: 10
  ppo_minibatch_steps: 64
  rollout_episodes_per_update: 5
  value_normalization_epsilon: 1e-4
  value_huber_delta: 1.0
  log_std_min:  -5
  log_std_max:  -1
  initial_policy_log_std: -2
  initial_household_action: [0.95, 0.2283105023]
  initial_government_action: [0.4, 0.1, 0.2, 0.1, 0.4, 0.2]
  household_warmup_epochs: 100
  hidden_size:  256
  cuda: False
  q_lr: 3e-6
  p_lr: 3e-6
  buffer_size:  1000
  env_name: 'wealth_distribution'
  init_exploration_policy:  'gaussian'
  n_epochs: 200000
  epoch_length: 500
  update_cycles:  10
  target_update_interval: 1
  display_interval: 1
  batch_size: 128
  gamma: 0.95
  government_gamma: 0.995
  household_gamma: 0.995
  tau:  5e-3
  eval_episodes: 20
  init_exploration_steps: 100
  ppo_tau: 0.95
  eps: 0.2
  update_epoch: 20
  clip: 0.2
  vloss_coef: 0.5
  ent_coef: 0.01
  max_grad_norm: 0.5
  update_freq: 3
  initial_train: 100
  noise_rate: 0.1
  epsilon: 0.1
  save_interval: 100
  lmbda: 0.9
  government_lambda: 0.95
  household_lambda: 0.99
  inter_group_weight: 1.0
  gov_action_interval: 10
  eval_interval_epochs: 10
